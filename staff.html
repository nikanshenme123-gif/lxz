<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理组成员 - 旅行者服务器</title>
    <style>
        /* 样式与您原有代码一致，为节省篇幅此处省略，请自行保留原有 style 部分 */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #00a8e8;
            --secondary: #00d4aa;
            --accent: #ff6b6b;
            --dark: #2d3436;
            --light: #f8f9fa;
            --white: #ffffff;
            --gray: #636e72;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        nav {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 168, 232, 0.1);
        }
        
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8em;
            font-weight: 900;
            text-decoration: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: 40px;
        }
        
        .nav-links a {
            color: var(--gray);
            text-decoration: none;
            font-weight: 500;
            position: relative;
            transition: all 0.3s;
            padding: 8px 0;
        }
        
        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s;
        }
        
        .nav-links a:hover::before,
        .nav-links a.active::before {
            width: 100%;
        }
        
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 20px 40px;
        }
        
        header {
            text-align: center;
            margin: 40px 0 60px;
            padding: 40px;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: var(--gray);
        }
        
        .staff-section {
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 168, 232, 0.1);
        }
        
        .staff-section h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--dark);
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid;
            border-image: linear-gradient(90deg, var(--primary), var(--secondary)) 1;
            display: inline-block;
        }
        
        .staff-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
        }
        
        .staff-member {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(0,168,232,0.05) 0%, rgba(0,212,170,0.05) 100%);
            border-radius: 15px;
            transition: all 0.4s;
            border: 1px solid rgba(0, 168, 232, 0.1);
        }
        
        .staff-member:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(0, 168, 232, 0.15);
        }
        
        .staff-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.2em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 168, 232, 0.3);
        }
        
        .staff-name {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--dark);
            font-size: 1.2em;
        }
        
        .staff-rank {
            font-size: 0.95em;
            color: var(--gray);
        }
        
        footer {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin-top: 80px;
        }
        
        footer p {
            color: rgba(255, 255, 255, 0.6);
        }
        
        @media (max-width: 768px) {
            .nav-links {
                gap: 20px;
                font-size: 0.9em;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .staff-list {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">旅行者</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="staff.html" class="active">管理组</a></li>
                <li><a href="rules.html">规则</a></li>
                <li><a href="commands.html">指令大全</a></li>
                <li><a href="gallery.html">服务器风景</a></li>
                <li><a href="contact.html">立即加入</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>管理组成员</h1>
            <p class="subtitle">认识我们的管理团队</p>
        </header>
        
        <div class="staff-section">
            <h2>服务器所有者</h2>
            <div class="staff-list">
                <div class="staff-member">
                    <div class="staff-avatar">D</div>
                    <div class="staff-name">dadiansuiyi</div>
                    <div class="staff-rank">服务器所有者</div>
                </div>
            </div>
        </div>
        
        <div class="staff-section">
            <h2>管理员</h2>
            <div class="staff-list">
                <div class="staff-member">
                    <div class="staff-avatar">Y</div>
                    <div class="staff-name">yaojunY</div>
                    <div class="staff-rank">管理员</div>
                </div>
                <div class="staff-member">
                    <div class="staff-avatar">J</div>
                    <div class="staff-name">J3u_Mog</div>
                    <div class="staff-rank">管理员</div>
                </div>
            </div>
        </div>
        
        <div class="staff-section">
            <h2>版主</h2>
            <div class="staff-list">
                <div class="staff-member">
                    <div class="staff-avatar">M</div>
                    <div class="staff-name">Mod1</div>
                    <div class="staff-rank">版主</div>
                </div>
                <div class="staff-member">
                    <div class="staff-avatar">M</div>
                    <div class="staff-name">Mod2</div>
                    <div class="staff-rank">版主</div>
                </div>
                <div class="staff-member">
                    <div class="staff-avatar">M</div>
                    <div class="staff-name">Mod3</div>
                    <div class="staff-rank">版主</div>
                </div>
            </div>
        </div>
        
        <div class="staff-section">
            <h2>助手</h2>
            <div class="staff-list">
                <div class="staff-member">
                    <div class="staff-avatar">H</div>
                    <div class="staff-name">Helper1</div>
                    <div class="staff-rank">助手</div>
                </div>
                <div class="staff-member">
                    <div class="staff-avatar">H</div>
                    <div class="staff-name">Helper2</div>
                    <div class="staff-rank">助手</div>
                </div>
                <div class="staff-member">
                    <div class="staff-avatar">H</div>
                    <div class="staff-name">Helper3</div>
                    <div class="staff-rank">助手</div>
                </div>
                <div class="staff-member">
                    <div class="staff-avatar">H</div>
                    <div class="staff-name">Helper4</div>
                    <div class="staff-rank">助手</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 旅行者 服务器. 保留所有权利.</p>
    </footer>

    <script>
        // 仅在 localStorage 有自定义管理组数据时才进行覆盖，否则保留 HTML 中原有的成员信息
        function loadStaffIfCustom() {
            try {
                const saved = localStorage.getItem('mcqwqData');
                if (!saved) return; // 没有自定义数据，保留 HTML 原有内容
                const data = JSON.parse(saved);
                if (!data.staff) return;
                
                // 有自定义数据，则按自定义数据更新各个区域
                // 所有者
                if (data.staff.owner) {
                    const ownerCard = document.querySelector('.staff-section:nth-child(2) .staff-member');
                    if (ownerCard) {
                        const owner = data.staff.owner;
                        const avatarDiv = ownerCard.querySelector('.staff-avatar');
                        if (owner.avatar) {
                            avatarDiv.innerHTML = `<img src="${owner.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                            avatarDiv.style.background = 'none';
                        } else {
                            avatarDiv.textContent = owner.name.charAt(0);
                            avatarDiv.style.background = 'linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%)';
                        }
                        ownerCard.querySelector('.staff-name').textContent = owner.name;
                        ownerCard.querySelector('.staff-rank').textContent = owner.rank;
                    }
                }
                
                // 管理员
                if (data.staff.admins && data.staff.admins.length) {
                    const adminCards = document.querySelectorAll('.staff-section:nth-child(3) .staff-member');
                    adminCards.forEach((card, idx) => {
                        if (data.staff.admins[idx]) {
                            const admin = data.staff.admins[idx];
                            const avatarDiv = card.querySelector('.staff-avatar');
                            if (admin.avatar) {
                                avatarDiv.innerHTML = `<img src="${admin.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                                avatarDiv.style.background = 'none';
                            } else {
                                avatarDiv.textContent = admin.name.charAt(0);
                                avatarDiv.style.background = 'linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%)';
                            }
                            card.querySelector('.staff-name').textContent = admin.name;
                            card.querySelector('.staff-rank').textContent = admin.rank;
                        }
                    });
                }
                
                // 版主
                if (data.staff.mods && data.staff.mods.length) {
                    const modCards = document.querySelectorAll('.staff-section:nth-child(4) .staff-member');
                    modCards.forEach((card, idx) => {
                        if (data.staff.mods[idx]) {
                            const mod = data.staff.mods[idx];
                            const avatarDiv = card.querySelector('.staff-avatar');
                            if (mod.avatar) {
                                avatarDiv.innerHTML = `<img src="${mod.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                                avatarDiv.style.background = 'none';
                            } else {
                                avatarDiv.textContent = mod.name.charAt(0);
                                avatarDiv.style.background = 'linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%)';
                            }
                            card.querySelector('.staff-name').textContent = mod.name;
                            card.querySelector('.staff-rank').textContent = mod.rank;
                        }
                    });
                }
                
                // 助手
                if (data.staff.helpers && data.staff.helpers.length) {
                    const helperCards = document.querySelectorAll('.staff-section:nth-child(5) .staff-member');
                    helperCards.forEach((card, idx) => {
                        if (data.staff.helpers[idx]) {
                            const helper = data.staff.helpers[idx];
                            const avatarDiv = card.querySelector('.staff-avatar');
                            if (helper.avatar) {
                                avatarDiv.innerHTML = `<img src="${helper.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                                avatarDiv.style.background = 'none';
                            } else {
                                avatarDiv.textContent = helper.name.charAt(0);
                                avatarDiv.style.background = 'linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%)';
                            }
                            card.querySelector('.staff-name').textContent = helper.name;
                            card.querySelector('.staff-rank').textContent = helper.rank;
                        }
                    });
                }
            } catch(e) {
                console.error('读取管理组数据失败', e);
            }
        }
        
        window.addEventListener('DOMContentLoaded', loadStaffIfCustom);
    </script>
</body>
</html>
